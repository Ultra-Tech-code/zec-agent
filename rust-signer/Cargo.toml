[package]
name = "rust-signer"
version = "0.1.0"
edition = "2021"
description = "Ironwood-only shielded signer sidecar for zec-agent-budget. Holds the real spending key; talks JSON-over-stdio to mcp-server."

[dependencies]
# NOTE: pin exact versions once you've confirmed current crates.io releases
# that target NU6.3 / Ironwood — check crates.io/librustzcash release notes
# before building, since this stack moved fast post-migration (mid/late 2026).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

zcash_client_backend = { version = "0.24.0", features = ["orchard", "transparent-inputs", "sync", "lightwalletd-tonic-transport"] }
zcash_keys = "0.16.1"
zcash_primitives = "0.30.1"
zcash_protocol = "0.10.6"
orchard = "0.15.5"
bip0039 = "0.12"
zip32 = "0.2"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
hex = "0.4.3"
zcash_client_sqlite = { version = "0.22.0", features = ["transparent-inputs", "unstable"] }
rand = "0.8.5"
tonic = "0.14"
rusqlite = "0.37"
async-trait = "0.1.92"
sapling-crypto = "0.7.0"
rand_core = "0.6.4"
jubjub = "0.10.0"
bls12_381 = "0.8.0"
zcash_address = "0.13.0"

[[bin]]
name = "rust-signer"
path = "src/main.rs"
